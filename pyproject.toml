[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "esdeck"
version = "0.11.0"
description = "Set up ES-DE (EmulationStation) on any machine and install provided games without the busywork"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["emulationstation", "es-de", "retroarch", "emulation", "roms"]
classifiers = [
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Installation/Setup",
]
dependencies = []          # stdlib only, on purpose - see README

[project.scripts]
esdeck = "esdeck.cli:main"

[tool.setuptools]
packages = ["esdeck"]
